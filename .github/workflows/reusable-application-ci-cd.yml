name: Reusable Application CI/CD

on:
  workflow_call:
    inputs:
      application:
        description: Kubernetes application and Docker Hub repository name
        required: true
        type: string
      source-path:
        description: Application source and Docker build context
        required: true
        type: string
      publish:
        description: Whether this run may publish an image
        required: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.application != 'kpi-service'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.source-path }}/package-lock.json
      - if: inputs.application == 'kpi-service'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.source-path }}/requirements.txt
      - name: Install Node.js dependencies
        if: inputs.application != 'kpi-service'
        working-directory: ${{ inputs.source-path }}
        run: npm ci
      - name: Install Python dependencies
        if: inputs.application == 'kpi-service'
        working-directory: ${{ inputs.source-path }}
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check code formatting
        if: inputs.application == 'asset-service' || inputs.application == 'data-service'
        working-directory: ${{ inputs.source-path }}
        run: npm run format:check
      - name: Run application tests
        working-directory: ${{ inputs.source-path }}
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          case "$APPLICATION" in
            asset-service|data-service) npm test -- --runInBand ;;
            kpi-service) python -m unittest discover -s tests -v ;;
            simulator) npm test ;;
            *) echo "Unsupported application: $APPLICATION" >&2; exit 1 ;;
          esac
      - name: Build NestJS application
        if: inputs.application == 'asset-service' || inputs.application == 'data-service'
        working-directory: ${{ inputs.source-path }}
        run: npm run build

  publish:
    needs: test
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.source-path }}
          file: ./${{ inputs.source-path }}/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.application }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.application }}
          cache-to: type=gha,mode=max,scope=${{ inputs.application }}
