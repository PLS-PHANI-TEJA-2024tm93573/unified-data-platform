services:
  kpi-service:
    build: .
    environment:
      ASSET_MODEL_URL: ${ASSET_MODEL_URL:-http://host.docker.internal:3000}
      DATA_SERVICE_URL: ${DATA_SERVICE_URL:-http://host.docker.internal:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/unified_data_platform}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      ASSET_CONFIG_JSON: ${ASSET_CONFIG_JSON-}
      COUNTER_BASELINE_DAYS: ${COUNTER_BASELINE_DAYS:-1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-7}
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
