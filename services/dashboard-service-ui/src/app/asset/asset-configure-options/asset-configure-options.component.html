
<div class="configure-header">
    <p-button
        icon="pi pi-chevron-left"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        (click)="navigatePrevious()" />
    <h3 class="text-3xl font-bold text-surface-900 dark:text-surface-0 m-0">
  Confiugre Asset
</h3>

</div>

<p-fieldset [legend]="assetDetails.name">
    <div class="configure-asset-buttons">
        <p-button
            label="Configure Child Assets"
            icon="pi pi-user"
            severity="secondary"
            (click) = "openChildAssetDialog(assetDetails.id)"
            />
        <p-button
            label="Configure Variables"
            icon="pi pi-gauge"
            severity="secondary"
            (click)="openVariablesDialog()" />
        <p-button
            label="Delete Asset"
            icon="pi pi-trash"
            severity="danger"
            (click)="deleteAsset()" />
    </div>
    <div class="configure-asset-details">
        <div class="asset-details">
            <span>Asset ID: </span>
         <span>
             {{assetDetails.id}}
        </span>
        </div>

        <div class="asset-details">
            <span>Asset Type:</span>
        <span>
            {{assetDetails.assetType.name}}
        </span>
        </div>

        <div class="asset-details">
            <span>Created On: </span>
            <span>
                {{assetDetails.createdAt}}
            </span>
        </div>

        <div class="asset-details">
            <span>
                Parent Asset:
            </span>
            <span>
                {{assetDetails.parentAsset?.name}}
            </span>
        </div>

    </div>
</p-fieldset>

<app-configure-child
    [(displayDialog)]="configureChildDialog"
    [assetId]="assetId"
></app-configure-child>

<app-configure-variables
    [(displayDialog)]="configureVariablesDialog"
    [assetId]="assetId"
></app-configure-variables>
