

<h3 class="text-3xl font-bold text-surface-900 dark:text-surface-0 m-0">
  Confiugre Asset 
</h3>
<p-fieldset [legend]="assetDetails.name">
    <div class="configure-asset-buttons">
        <p-button label="Add Child Asset" icon="pi pi-user" severity="secondary" />
        <p-button label="Add Variables" icon="pi pi-gauge"  severity="secondary"/>
    </div>
    <div class="configure-asset-details">
        <div class="asset-details">
            <span>Asset ID: </span>
         <span>
             {{assetDetails.id}}
        </span>
        </div>

        <div class="asset-details">
            <span>Asset Type:</span>
        <span>
            {{assetDetails.assetType.name}}
        </span>
        </div>
        
        <div class="asset-details">
            <span>Created On: </span>
            <span>
                {{assetDetails.createdAt}}
            </span>
        </div>

        <div class="asset-details">
            <span>
                Parent Asset: 
            </span>
            <span>
                {{assetDetails.parentAsset?.name}}
            </span>
        </div>
        
    </div>
</p-fieldset>
