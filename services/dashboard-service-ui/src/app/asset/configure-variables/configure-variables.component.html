<p-dialog
  header="Configure Variables"
  [(visible)]="displayDialog"
  [modal]="true"
  [style]="{ width: '90vw' }"
  [breakpoints]="{ '960px': '85vw', '640px': '95vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onCloseDialog()">

  <div class="py-4">
    <div class="flex justify-end mb-3">
      <p-button
        label="Add"
        icon="pi pi-plus"
        variant="outlined"
        severity="contrast"
        (click)="openAddVariableDialog()" />
    </div>

    <p-table
      [value]="assetVariables"
      [paginator]="true"
      [rows]="5"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped p-datatable-bordered">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="variableDefinition.name">
            Name <p-sortIcon field="variableDefinition.name"></p-sortIcon>
          </th>
          <th pSortableColumn="variableDefinition.id">
            ID <p-sortIcon field="variableDefinition.id"></p-sortIcon>
          </th>
          <th pSortableColumn="variableDefinition.dataType">
            Data Type <p-sortIcon field="variableDefinition.dataType"></p-sortIcon>
          </th>
          <th pSortableColumn="variableDefinition.unit">
            Unit <p-sortIcon field="variableDefinition.unit"></p-sortIcon>
          </th>
          <th pSortableColumn="isCustom">
            Custom <p-sortIcon field="isCustom"></p-sortIcon>
          </th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-assetVariable>
        <tr>
          <td>{{ assetVariable.variableDefinition?.name }}</td>
          <td>{{ assetVariable.variableDefinition?.id }}</td>
          <td>{{ assetVariable.variableDefinition?.dataType }}</td>
          <td>{{ assetVariable.variableDefinition?.unit }}</td>
          <td>{{ assetVariable.isCustom }}</td>
          <td>
            <p-button
              label="Remove"
              icon="pi pi-times"
              variant="outlined"
              severity="danger"
              (click)="removeAssetVariable(assetVariable.variableDefinition.id)" />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4">No variables found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2 pt-2">
      <p-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCloseDialog()" />
      <p-button
        label="Submit"
        icon="pi pi-check"
        (onClick)="onSubmit()" />
    </div>
  </ng-template>
</p-dialog>

<app-add-variable-dialog
  [(displayDialog)]="addVariableDialog"
  [assetId]="assetId"
  (variableAdded)="loadAssetVariables()">
</app-add-variable-dialog>
