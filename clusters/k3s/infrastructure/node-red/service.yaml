apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: industrial-iot
  labels:
    app.kubernetes.io/name: node-red
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
      nodePort: 31880
      protocol: TCP
