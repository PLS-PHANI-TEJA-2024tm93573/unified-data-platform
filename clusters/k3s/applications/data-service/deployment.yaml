apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: industrial-iot
  labels:
    app.kubernetes.io/name: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: data-service
          image: docker.io/plsphaniteja2024tm93573/data-service:297e51779bc15f6daa15deea0a2a7ad17483b37d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: data-service-config
          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
