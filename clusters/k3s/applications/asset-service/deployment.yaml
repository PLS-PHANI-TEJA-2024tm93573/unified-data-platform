apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: industrial-iot
  labels:
    app.kubernetes.io/name: asset-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: asset-service
          image: docker.io/plsphaniteja2024tm93573/asset-service:9222dc21cb8fab9c5be30fdef077d2dc4f231c7a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: asset-service-config
          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
