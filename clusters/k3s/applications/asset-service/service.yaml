apiVersion: v1
kind: Service
metadata:
  name: asset-service
  namespace: industrial-iot
  labels:
    app.kubernetes.io/name: asset-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asset-service
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
